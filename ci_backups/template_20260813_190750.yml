apiVersion: influxdata.com/v2alpha1
kind: Dashboard
metadata:
  name: sensor-gateway-dashboard
spec:
  name: Sensor Gateway Dashboard
  description: Live edge gateway sensor values with numerical statistics
  charts:
    - name: "Current Joystick X"
      kind: Single_Stat
      width: 4
      height: 2
      colors:
        - hex: "#00C9FF"
          id: base
          name: pool
          type: min
      staticLegend: {}
      queries:
        - query: 'from(bucket: "sensor_data") |> range(start: -15m) |> filter(fn: (r) => r["_measurement"] == "joystick") |> filter(fn: (r) => r["_field"] == "x") |> last()'
    - name: "Current Joystick Y"
      kind: Single_Stat
      width: 4
      height: 2
      xPos: 4
      colors:
        - hex: "#00C9FF"
          id: base
          name: pool
          type: min
      staticLegend: {}
      queries:
        - query: 'from(bucket: "sensor_data") |> range(start: -15m) |> filter(fn: (r) => r["_measurement"] == "joystick") |> filter(fn: (r) => r["_field"] == "y") |> last()'
    - name: "Current Button Count"
      kind: Single_Stat
      width: 4
      height: 2
      xPos: 8
      colors:
        - hex: "#00C9FF"
          id: base
          name: pool
          type: min
      staticLegend: {}
      queries:
        - query: 'from(bucket: "sensor_data") |> range(start: -15m) |> filter(fn: (r) => r["_measurement"] == "buttons") |> filter(fn: (r) => r["_field"] == "value") |> last()'
    - name: "Joystick Position (X/Y)"
      kind: Xy
      geom: line
      width: 6
      height: 4
      yPos: 2
      axes:
        - base: "10"
          name: x
          scale: linear
        - base: "10"
          name: "y"
          scale: linear
      colors:
        - hex: "#00C9FF"
          id: base
          name: pool
          type: min
      staticLegend: {}
      queries:
        - query: 'from(bucket: "sensor_data") |> range(start: v.timeRangeStart, stop: v.timeRangeStop) |> filter(fn: (r) => r["_measurement"] == "joystick") |> filter(fn: (r) => r["_field"] == "x" or r["_field"] == "y") |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false) |> yield(name: "mean")'
    - name: "Button Presses"
      kind: Xy
      geom: line
      width: 6
      height: 4
      xPos: 6
      yPos: 2
      axes:
        - base: "10"
          name: x
          scale: linear
        - base: "10"
          name: "y"
          scale: linear
      colors:
        - hex: "#00C9FF"
          id: base
          name: pool
          type: min
      staticLegend: {}
      queries:
        - query: 'from(bucket: "sensor_data") |> range(start: v.timeRangeStart, stop: v.timeRangeStop) |> filter(fn: (r) => r["_measurement"] == "buttons") |> filter(fn: (r) => r["_field"] == "value") |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false) |> yield(name: "mean")'
