apiVersion: influxdata.com/v2alpha1
kind: Dashboard
metadata:
  name: sensor-gateway-dashboard
spec:
  name: Sensor Gateway Dashboard
  description: Live edge gateway sensor values and moving averages
  charts:
    - name: "Joystick Position (X/Y)"
      kind: Xy
      geom: line
      width: 6
      height: 4
      axes:
        - name: x
          base: "10"
          scale: linear
        - name: "y"
          base: "10"
          scale: linear
      staticLegend: {}
      queries:
        - query: |-
            from(bucket: "sensor_data")
              |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
              |> filter(fn: (r) => r["_measurement"] == "joystick")
              |> filter(fn: (r) => r["_field"] == "x" or r["_field"] == "y")
              |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)
              |> yield(name: "mean")
    - name: "Button Presses"
      kind: Xy
      geom: line
      width: 6
      height: 4
      xPos: 6
      axes:
        - name: x
          base: "10"
          scale: linear
        - name: "y"
          base: "10"
          scale: linear
      staticLegend: {}
      queries:
        - query: |-
            from(bucket: "sensor_data")
              |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
              |> filter(fn: (r) => r["_measurement"] == "buttons")
              |> filter(fn: (r) => r["_field"] == "pressed_count")
              |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)
              |> yield(name: "mean")
    - name: "Joystick Magnitude (1h Mean)"
      kind: Xy
      geom: line
      width: 6
      height: 4
      yPos: 4
      axes:
        - name: x
          base: "10"
          scale: linear
        - name: "y"
          base: "10"
          scale: linear
      staticLegend: {}
      queries:
        - query: |-
            from(bucket: "sensor_data")
              |> range(start: -1h)
              |> filter(fn: (r) => r["_measurement"] == "joystick")
              |> filter(fn: (r) => r["_field"] == "magnitude")
              |> aggregateWindow(every: 5m, fn: mean, createEmpty: false)
              |> yield(name: "mean_1h")
    - name: "Joystick Magnitude (24h Mean)"
      kind: Xy
      geom: line
      width: 6
      height: 4
      xPos: 6
      yPos: 4
      axes:
        - name: x
          base: "10"
          scale: linear
        - name: "y"
          base: "10"
          scale: linear
      staticLegend: {}
      queries:
        - query: |-
            from(bucket: "sensor_data")
              |> range(start: -24h)
              |> filter(fn: (r) => r["_measurement"] == "joystick")
              |> filter(fn: (r) => r["_field"] == "magnitude")
              |> aggregateWindow(every: 1h, fn: mean, createEmpty: false)
              |> yield(name: "mean_24h")
