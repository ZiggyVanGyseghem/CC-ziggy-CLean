name: Automated Branch Backup Snapshot

on:
  schedule:
    - cron: '0 0 */2 * *' # Automatically runs every 2 days at midnight
  workflow_dispatch: # Allows manual one-click backup trigger from GitHub UI

jobs:
  branch-backup:
    name: Create Full Repository Branch Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Full Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push Full Snapshot to Dedicated Backup Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          echo "Creating full repository snapshot for date: ${TIMESTAMP}"
          
          # Create and update dedicated backup-snapshot branch with complete codebase state
          git checkout -B backup-snapshot
          git commit --allow-empty -m "backup: full repository snapshot for ${TIMESTAMP}"
          git push origin backup-snapshot --force
          
          echo "[SUCCESS] Full repository snapshot pushed to branch 'backup-snapshot'!"
